# Rebuilds every result from the committed code and data on a clean runner, and fails
# if any committed output changes. This is the "How to Reproduce" section, run by a machine.
name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install pinned requirements
        run: pip install -r code/requirements.txt

      - name: Forecast (writes submission.csv and code/backtest_results.csv)
        run: python code/forecast.py

      - name: submission.csv is byte-identical to the committed file
        run: |
          git diff --exit-code --stat -- submission.csv code/backtest_results.csv
          sha256sum submission.csv

      - name: Challenge format check (reads the city list from the Hugging Face Hub)
        run: python code/check_submission.py

      - name: Look-ahead (leakage) test
        run: python code/check_leakage.py

      # Outputs are rounded to 2 decimals, so platform floating-point differences can move a
      # last digit by 0.01. Show any byte-level diff, then compare values with that tolerance.
      - name: Rebuild outputs/ and confirm they are unchanged
        run: |
          python code/export.py
          python code/policy_analysis.py
          git diff --stat -- outputs/ | sed 's/^/::notice::/'
          git diff --unified=0 -- outputs/*.csv | grep '^[-+][^-+]' | sed -n '1,6s/^/::notice::/p' || true
          python code/compare_outputs.py
